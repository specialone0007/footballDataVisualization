name: ci
# Checks run only on a push to main, which a merge makes; pull requests
# and other branches run nothing, so they spend no Actions minutes.
on:
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest -q
      - run: footviz render data/mancity-chelsea-fawsl-2018-19.json --out /tmp/figs --dpi 60
